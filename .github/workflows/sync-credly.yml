name: Auto-Sync Credly Badges

on:
  schedule:
    # Runs automatically every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Badges from Credly API
        run: node scripts/sync-credly.js

      - name: Commit and Push if Changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/credlyBadges.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): sync new Credly badges"
            git push origin main
          else
            echo "No new badges found on Credly profile."
          fi
